quarkus.http.host=${HOST:0.0.0.0}
quarkus.http.port=${PORT:3000}

quarkus.http.idle-timeout=120s
quarkus.http.accept-backlog=65535
quarkus.http.so-reuse-port=true
quarkus.http.limits.max-body-size=16K
quarkus.http.enable-compression=true
quarkus.http.compression-level=1
quarkus.vertx.prefer-native-transport=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=${DATABASE_URL}
quarkus.datasource.reactive.max-size=${DB_POOL:64}
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.datasource.reactive.postgresql.pipelining-limit=256

quarkus.devservices.enabled=false
quarkus.banner.enabled=false
