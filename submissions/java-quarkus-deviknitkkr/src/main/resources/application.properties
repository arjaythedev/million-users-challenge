quarkus.banner.enabled=false
quarkus.vertx.prefer-native-transport=true
quarkus.log.console.async=true
quarkus.log.console.async.queue-length=1024
quarkus.log.console.async.overflow=discard
quarkus.http.host=${HOST:127.0.0.1}
quarkus.http.port=${PORT:3000}
quarkus.http.idle-timeout=90s
quarkus.http.accept-backlog=8192
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.reactive.enabled=false
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false
