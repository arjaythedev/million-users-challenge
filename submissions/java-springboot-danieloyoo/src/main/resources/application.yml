spring:
  application:
    name: Feed-Application
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: off
    lazy-initialization: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://million-users-pg:5432/feed_seed}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL:128}
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 5000
  sql:
    init:
      mode: never
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:3000}
  tomcat:
    max-connections: 2000000
    accept-count: 8192
    keep-alive-timeout: 90s
    connection-timeout: 90s
    max-keep-alive-requests: -1
  compression:
    enabled: true
    mime-types: application/json

# JWT Secret configuration
jwt:
  secret: ${JWT_SECRET:million-users-challenge}