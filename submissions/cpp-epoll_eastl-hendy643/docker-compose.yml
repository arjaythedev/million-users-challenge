services:
  server:
    build: .
    image: cpp-epoll_eastl-hendy643
    cpuset: "${CPUSET:-0-15}"
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    mem_limit: 32g
    memswap_limit: 32g
    ulimits:
      nofile:
        soft: 2097152
        hard: 2097152
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point at a Postgres with the feed_seed schema}
      JWT_SECRET: million-users-challenge
      HOST: 0.0.0.0
      PORT: ${HOST_PORT:-8080}
      EXTRA_PORT: ${HOST_EXTRA_PORT:-8081}
