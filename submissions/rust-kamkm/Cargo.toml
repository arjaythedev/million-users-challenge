[package]
name = "feed"
version = "0.2.0"
edition = "2021"
publish = false

# Nothing here is a runtime or a driver: io-uring is the kernel interface, pg.rs speaks the
# Postgres wire protocol, hmac/sha2 do HS256 and SCRAM, memchr finds bytes. ISA-L (built from
# source in build.sh, linked statically through build.rs) provides the gzip compression.
[dependencies]
io-uring = "=0.7.15"
libc = "=0.2.177"
hmac = "=0.12.1"
sha2 = "=0.10.9"
memchr = "=2.8.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
