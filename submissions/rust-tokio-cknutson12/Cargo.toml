[package]
name = "feed-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Thread-per-core: one current-thread tokio runtime per core, no work stealing.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# Pipelines concurrent queries on one connection; no TLS (private network).
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
socket2 = { version = "0.6", features = ["all"] }
httparse = "1"
libdeflater = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
itoa = "1"

[profile.release]
lto = "fat"
codegen-units = 1
