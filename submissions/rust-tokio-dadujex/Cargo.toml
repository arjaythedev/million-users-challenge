[package]
name = "feed-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
# One current-thread runtime per worker thread: no multi-thread scheduler, no sync primitives needed.
tokio = { version = "1", features = ["rt", "net", "time"] }
# Postgres driver: pure Rust, no TLS (the database is on the private network), pipelines concurrent queries.
tokio-postgres = "0.7"
httparse = "1"
# One-shot gzip of the feed body (C library built from source by its build script).
libdeflater = "1"
mimalloc = "0.1"
# The same versions tokio-postgres uses for SCRAM, so they are built once.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
serde_json = "1"
itoa = "1"

[profile.release]
lto = "fat"
codegen-units = 1
