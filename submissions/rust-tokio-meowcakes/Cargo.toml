[package]
name = "feed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "io-util"] }
socket2 = { version = "=0.6.5", features = ["all"] }
httparse = "=1.10.1"
itoa = "=1.0.18"
serde_json = "=1.0.154"
base64 = "=0.22.1"
hmac = "=0.13.0"
sha2 = "=0.11.1"
postgres-protocol = "=0.6.12"
crc32fast = "=1.5.4"
io-uring = "=0.7.15"
libc = "=0.2.186"

[dev-dependencies]
libdeflater = "=1.26.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
